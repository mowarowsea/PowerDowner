<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PowerDowner</title>
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="theme-color" content="#c9820e">
  <link rel="stylesheet" href="/vendor/fa/css/all.min.css">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="top">
    <div class="brand"><img src="/favicon.svg" alt="" width="26" height="26"><h1>PowerDowner</h1></div>
    <div class="engines" id="engines"></div>
    <div class="spacer"></div>
    <label class="userpick">
      <span>ユーザー</span>
      <select id="userSelect"></select>
    </label>
    <button id="btnHosters" class="ghost">アップローダ</button>
    <button id="btnUsers" class="ghost">ユーザー / 設定</button>
  </header>

  <div id="toasts" class="toasts" aria-live="polite"></div>

  <div id="captchaBanner" class="banner" hidden></div>

  <main>
    <section class="card add">
      <textarea id="urls" rows="3" placeholder="URL を貼る (複数行 OK)"></textarea>
      <details id="workBox" class="work">
        <summary>作品として登録する (DryEyes を通さない)</summary>
        <!-- 作品名・著者は打つと棚 (pinax) の候補を出す。棚と 1 文字違うと別フォルダに割れるので、
             既にある綴りを選べるようにしておく。巻数は候補に表示するだけで欄には入れない -->
        <div class="suggestwrap">
          <div class="row">
            <input id="workTitle" type="text" placeholder="作品名 (入れると作品として登録される)" autocomplete="off">
            <input id="workAuthor" type="text" placeholder="著者 (任意)" autocomplete="off">
            <input id="workVolume" type="text" class="vol" placeholder="巻数 (例: 3 / 1-7)">
          </div>
          <ul id="shelfHits" class="shelfhits" role="listbox" hidden></ul>
        </div>
        <p id="shelfNote" class="hint small shelfnote" hidden></p>
      </details>
      <div class="row">
        <input id="destDir" type="text" placeholder="保存先を上書き (空欄ならユーザーの既定フォルダ)">
        <button id="btnAdd" class="primary">追加</button>
      </div>
      <div id="addError" class="error" hidden></div>
    </section>

    <section id="civitBox" class="civit" hidden>
      <div class="civithead">
        <h2>CivitAI</h2>
        <div class="spacer"></div>
        <label class="toggle"><input type="checkbox" id="civitHideNsfw"> NSFW の画像を候補から外す</label>
        <button id="btnCivitAll" class="primary small" hidden>まとめて追加</button>
      </div>
      <div id="civitCards" class="civitcards"></div>
    </section>

    <section class="card">
      <div class="listhead">
        <h2>ジョブ</h2>
        <label class="toggle"><input type="checkbox" id="showAll"> 全ユーザー表示</label>
        <div class="spacer"></div>
        <button id="btnClearDone" class="ghost small">完了分を一覧から消す</button>
      </div>
      <div id="jobs" class="jobs"></div>
      <div id="jobsEmpty" class="empty" hidden>ジョブはありません</div>
    </section>
  </main>

  <dialog id="usersDialog">
    <form method="dialog" class="dialog">
      <h2>ユーザー</h2>
      <table class="users">
        <thead><tr><th>名前</th><th>既定フォルダ</th><th></th></tr></thead>
        <tbody id="usersBody"></tbody>
        <tfoot>
          <tr>
            <td><input id="newUserName" type="text" placeholder="新しいユーザー名"></td>
            <td><input id="newUserDir" type="text" placeholder="D:\Downloads\name"></td>
            <td><button type="button" id="btnNewUser" class="primary small">追加</button></td>
          </tr>
        </tfoot>
      </table>

      <h2>CivitAI</h2>
      <div class="row">
        <input id="civitaiToken" type="password" placeholder="API キー (空欄で保存すると削除)">
        <span id="civitaiTokenState" class="hint"></span>
        <button type="button" id="btnSaveToken" class="primary small">保存</button>
      </div>
      <div class="row">
        <input id="civitaiRoot" type="text" placeholder="例: C:\SD\models (StableDiffusion / Lora が並ぶフォルダ)">
        <button type="button" id="btnSaveRoot" class="primary small">保存</button>
      </div>

      <div id="dialogError" class="error" hidden></div>
      <div class="row end">
        <button value="close" class="ghost">閉じる</button>
      </div>
    </form>
  </dialog>

  <dialog id="hostersDialog">
    <form method="dialog" class="dialog wide">
      <h2>アップローダ</h2>
      <div id="hostersWarn" class="banner warn" hidden></div>
      <table class="hosters">
        <thead>
          <tr>
            <th>アップローダ</th>
            <th class="num" title="実ファイルが残った回数">成功</th>
            <th class="num" title="ダウンロードを始められなかった回数を含む。所持済みスキップは含まない">失敗</th>
            <th class="num" title="CAPTCHA などで人間の操作を求めた回数 (ジョブごとに 1 回)">人間待ち</th>
            <th>最後の成功</th>
            <th class="mid">使用する</th>
            <th class="mid">優先度</th>
          </tr>
        </thead>
        <tbody id="hostersBody"></tbody>
      </table>
      <p class="hint small">上から順に試す。切った業者は DryEyes から来てもジョブにならない。</p>
      <div id="hostersError" class="error" hidden></div>
      <div class="row end">
        <button value="close" class="ghost">閉じる</button>
      </div>
    </form>
  </dialog>

  <footer class="log"><pre id="log"></pre></footer>

  <script src="/app.js"></script>
</body>
</html>
